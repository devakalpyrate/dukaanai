<script id="dukaan-scroll-listener">
  (function() {
    var scrollTimeoutMap = new WeakMap();
    function markScrolling(el) {
      if (!el || !el.classList) return;
      el.classList.add('is-scrolling');
      var timer = scrollTimeoutMap.get(el);
      if (timer) clearTimeout(timer);
      scrollTimeoutMap.set(el, setTimeout(function() {
        el.classList.remove('is-scrolling');
      }, 800));
    }
    function handleScrollEvent(e) {
      var t = e.target;
      var el = (t === document || t === window) ? (document.documentElement || document.body) : t;
      markScrolling(el);
      if ((e.type === 'wheel' || e.type === 'touchmove') && el) {
        var p = el;
        while (p && p !== document.body && p !== document.documentElement) {
          if (p.scrollHeight > p.clientHeight || p.scrollWidth > p.clientWidth) {
            markScrolling(p);
            break;
          }
          p = p.parentElement;
        }
      }
    }
    window.addEventListener('scroll', handleScrollEvent, { capture: true, passive: true });
    window.addEventListener('wheel', handleScrollEvent, { capture: true, passive: true });
    window.addEventListener('touchmove', handleScrollEvent, { capture: true, passive: true });
  })();
</script>

<script id="dukaan-spectrum-runtime-styler">
  (function() {
    var linesCache = null;
    var lastQuery = 0;

    function animateSpectrum(now) {
      if (!linesCache || linesCache.length !== 36 || (now - lastQuery > 1000)) {
        var found = document.querySelectorAll('svg[viewBox="0 0 320 24"] line');
        if (found && found.length === 36) {
          linesCache = found;
        } else {
          linesCache = null;
        }
        lastQuery = now;
      }

      if (linesCache && linesCache.length === 36) {
        var vol = window.__dukaanLiveVol || 0;
        var isSpeaking = window.__dukaanIsSpeaking || false;

        if (isSpeaking && vol < 0.05) {
          var tWave = now * 0.006;
          vol = 0.3 + 0.18 * Math.sin(tWave) + 0.12 * Math.cos(tWave * 2.3);
          if (vol < 0.08) vol = 0.08;
        }

        var tSec = now * 0.001;
        var hasVoice = vol > 0.02;
        var freqData = window.__dukaanFreqData;

        for (var j = 0; j < 36; j++) {
          var line = linesCache[j];
          var color = (j % 2 === 0) ? '#000000' : '#64748B';

          if (line.style.stroke !== color) {
            line.style.setProperty('stroke', color, 'important');
            line.setAttribute('stroke', color);
            line.style.setProperty('stroke-width', '2.8px', 'important');
            line.style.setProperty('stroke-linecap', 'round', 'important');
          }

          var norm = (j + 0.5) / 36;
          var bell = Math.sin(norm * Math.PI);
          var arch = 0.32 + 0.68 * bell;

          var wave1 = Math.sin(tSec * 7.5 + j * 0.42);
          var wave2 = Math.cos(tSec * 11.2 - j * 0.38);
          var wave3 = Math.sin(tSec * 16.8 + j * 0.65);
          var waveComposite = (wave1 * 0.45 + wave2 * 0.35 + wave3 * 0.2);

          var freqBoost = 0;
          if (freqData && freqData.length > 0) {
            var binIdx = Math.floor(norm * Math.min(freqData.length - 1, 48));
            freqBoost = (freqData[binIdx] / 255) * 9.0;
          }

          var ambient = 1.6 + 1.2 * bell + waveComposite * 0.8;
          var voiceAmp = (vol * 16 + freqBoost + (waveComposite + 1) * (vol * 7 + 2));
          var totalAmp = hasVoice ? (ambient + voiceAmp) : ambient;

          var h = Math.max(1.8, Math.min(10.6, totalAmp * arch));

          line.setAttribute('y1', (12 - h).toFixed(2));
          line.setAttribute('y2', (12 + h).toFixed(2));
        }
      }

      requestAnimationFrame(animateSpectrum);
    }

    requestAnimationFrame(animateSpectrum);
  })();
</script>

<script id="dukaan-windows-toast-engine">
  (function() {
    var container = document.getElementById('dukaan-windows-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'dukaan-windows-toast-container';
      document.body.appendChild(container);
    }

    var ICONS = {
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };

    var recentMessages = new Map();

    window.showDukaanNotification = function(opts) {
      if (!opts) return;
      var title = opts.title || (opts.type === 'error' ? 'Error' : 'Notification');
      var message = opts.message || opts.text || '';
      var type = (opts.type && ICONS[opts.type]) ? opts.type : 'success';
      var duration = typeof opts.duration === 'number' ? opts.duration : 4000;

      if (!message && !title) return;

      var dedupeKey = title + '::' + message;
      var now = Date.now();
      if (recentMessages.has(dedupeKey) && (now - recentMessages.get(dedupeKey) < 1500)) {
        return;
      }
      recentMessages.set(dedupeKey, now);

      var toast = document.createElement('div');
      toast.className = 'win11-toast';
      toast.setAttribute('role', 'alert');

      var iconSvg = ICONS[type] || ICONS.success;
      var progressClass = 'win11-progress-' + type;

      toast.innerHTML = 
        '<div class="win11-toast-header">' +
          '<div class="win11-header-left">' +
            '<div class="win11-app-badge">D</div>' +
            '<span class="win11-app-name">DukaanAI</span>' +
            '<span class="win11-dot">•</span>' +
            '<span class="win11-header-tag">Just now</span>' +
          '</div>' +
          '<button type="button" class="win11-close-btn" aria-label="Dismiss Notification" title="Dismiss">✕</button>' +
        '</div>' +
        '<div class="win11-toast-body">' +
          '<div class="win11-status-icon win11-icon-' + type + '">' + iconSvg + '</div>' +
          '<div class="win11-text-block">' +
            '<div class="win11-title">' + title + '</div>' +
            '<div class="win11-desc">' + message + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="win11-progress-track">' +
          '<div class="win11-progress-bar ' + progressClass + '"></div>' +
        '</div>';

      var progressBar = toast.querySelector('.win11-progress-bar');
      var closeBtn = toast.querySelector('.win11-close-btn');

      var remaining = duration;
      var start = Date.now();
      var timerId = null;
      var isDismissing = false;

      function dismiss() {
        if (isDismissing) return;
        isDismissing = true;
        if (timerId) clearTimeout(timerId);
        toast.classList.add('win-toast-dismissing');
        setTimeout(function() {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 280);
      }

      function startCountdown() {
        start = Date.now();
        if (progressBar) {
          progressBar.style.transition = 'width ' + remaining + 'ms linear';
          progressBar.style.width = '0%';
        }
        timerId = setTimeout(dismiss, remaining);
      }

      function pauseCountdown() {
        if (timerId) clearTimeout(timerId);
        if (progressBar) {
          var elapsed = Date.now() - start;
          remaining = Math.max(200, remaining - elapsed);
          var currentPercent = (remaining / duration) * 100;
          progressBar.style.transition = 'none';
          progressBar.style.width = currentPercent + '%';
        }
      }

      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dismiss();
      });

      toast.addEventListener('mouseenter', pauseCountdown);
      toast.addEventListener('mouseleave', function() {
        if (!isDismissing) startCountdown();
      });

      container.appendChild(toast);
      while (container.children.length > 4) {
        container.removeChild(container.firstChild);
      }

      setTimeout(function() {
        if (!isDismissing) startCountdown();
      }, 30);
    };

    window.addEventListener('dukaan:notify', function(e) {
      if (e && e.detail) {
        window.showDukaanNotification(e.detail);
      }
    });

    window.addEventListener('dukaanai:data_updated', function(e) {
      if (e && e.detail) {
        var d = e.detail;
        var msg = d.message || d.spoken_message || '';
        if (msg && !d.clarification_needed) {
          window.showDukaanNotification({
            title: 'DukaanAI Action',
            message: msg,
            type: 'success'
          });
        }
      }
    });

    var bannerObserver = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.addedNodes) {
          for (var j = 0; j < m.addedNodes.length; j++) {
            var node = m.addedNodes[j];
            if (node.nodeType === 1) {
              checkAndUpgradeBanner(node);
              var matches = node.querySelectorAll ? node.querySelectorAll('[class*="bg-emerald"], [class*="bg-rose"], [class*="bg-amber"]') : [];
              for (var k = 0; k < matches.length; k++) {
                checkAndUpgradeBanner(matches[k]);
              }
            }
          }
        }
      }
    });

    function checkAndUpgradeBanner(el) {
      if (!el || !el.className || typeof el.className !== 'string') return;
      if (el.closest && (el.closest('#dukaan-windows-toast-container') || el.closest('.win11-toast'))) return;
      
      var cls = el.className || '';
      var isWarning = cls.indexOf('amber') !== -1 || cls.indexOf('yellow') !== -1;
      var isErr = cls.indexOf('rose') !== -1 || cls.indexOf('red') !== -1;
      var isSuccess = cls.indexOf('emerald') !== -1 || cls.indexOf('green') !== -1;
      var isAlertBanner = (isSuccess || isErr || isWarning) && (
        cls.indexOf('rounded-xl') !== -1 || cls.indexOf('rounded-2xl') !== -1 || cls.indexOf('rounded-lg') !== -1 || cls.indexOf('p-3') !== -1 || cls.indexOf('p-2') !== -1
      );

      if (isAlertBanner && !el.dataset.winUpgraded) {
        var text = (el.innerText || el.textContent || '').trim();
        if (text && text.length > 2 && text.length < 300) {
          if (el.tagName !== 'BUTTON' && !el.querySelector('table') && !el.querySelector('input') && !el.querySelector('form')) {
            el.dataset.winUpgraded = 'true';
            var type = isErr ? 'error' : (isWarning ? 'warning' : 'success');
            var isSettings = text.toLowerCase().indexOf('setting') !== -1;
            var title = isSettings ? (isErr ? 'Settings Error' : 'Settings Saved') : (isErr ? 'Error' : (isWarning ? 'Notice' : 'Success'));
            
            el.style.display = 'none';

            window.showDukaanNotification({
              title: title,
              message: text,
              type: type
            });
          }
        }
      }
    }

    function setNativeValue(element, value) {
      try {
        var valueSetter = Object.getOwnPropertyDescriptor(element, 'value')?.set;
        var prototype = Object.getPrototypeOf(element);
        var prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set;
        if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
          prototypeValueSetter.call(element, value);
        } else if (valueSetter) {
          valueSetter.call(element, value);
        } else {
          element.value = value;
        }
        element.dispatchEvent(new Event('input', { bubbles: true }));
        element.dispatchEvent(new Event('change', { bubbles: true }));
      } catch (err) {
        element.value = value;
      }
    }

    function checkOtpInputs() {
      var otpInputs = document.querySelectorAll('input[placeholder*="6-digit code"], input[placeholder*="Enter 6-digit"]');
      for (var i = 0; i < otpInputs.length; i++) {
        var inp = otpInputs[i];
        inp.setAttribute('autocomplete', 'one-time-code');
        if (!inp.dataset.pasteEnhanced) {
          inp.dataset.pasteEnhanced = 'true';
          
          var urlOtp = new URLSearchParams(window.location.search).get('otp');

            setNativeValue(inp, urlOtp.replace(/\D/g, '').slice(0, 6));

          var label = inp.previousElementSibling;

            label.style.display = 'flex';
            label.style.justifyContent = 'space-between';
            label.style.alignItems = 'center';
            var pasteBtn = document.createElement('button');
            pasteBtn.type = 'button';
            pasteBtn.className = 'otp-paste-btn';
            pasteBtn.innerText = '📋 Paste Code';
            pasteBtn.style.cssText = 'font-size: 11px; font-weight: 700; color: #FFD026; background: rgba(255, 208, 38, 0.12); border: 1px solid rgba(255, 208, 38, 0.35); border-radius: 6px; padding: 2px 8px; cursor: pointer; text-transform: none; letter-spacing: normal; transition: all 0.15s ease;';
            pasteBtn.onmouseover = function() { this.style.background = 'rgba(255, 208, 38, 0.25)'; };
            pasteBtn.onmouseout = function() { this.style.background = 'rgba(255, 208, 38, 0.12)'; };
            pasteBtn.onclick = (function(targetInp) {
              return function(e) {
                e.preventDefault();
                if (navigator.clipboard && navigator.clipboard.readText) {
                  navigator.clipboard.readText().then(function(clipText) {
                    var digits = (clipText || '').replace(/\D/g, '').slice(0, 6);
                    if (digits && digits.length === 6) {
                      setNativeValue(targetInp, digits);
                      window.showDukaanNotification && window.showDukaanNotification({
                        title: 'Code Pasted',
                        message: 'Filled verification code ' + digits,
                        type: 'success'
                      });
                    } else {
                      window.showDukaanNotification && window.showDukaanNotification({
                        title: 'Clipboard',
                        message: 'No 6-digit code found in clipboard.',
                        type: 'warning'
                      });
                    }
                  }).catch(function() {
                    targetInp.focus();
                  });
                } else {
                  targetInp.focus();
                }
              };
            })(inp);
            label.appendChild(pasteBtn);
          }
        }
      }
    }

    if (document.body) {
      bannerObserver.observe(document.body, { childList: true, subtree: true });
      setInterval(checkOtpInputs, 500);
    } else {
      window.addEventListener('DOMContentLoaded', function() {
        bannerObserver.observe(document.body, { childList: true, subtree: true });
        setInterval(checkOtpInputs, 500);
      });
    }
  })();
</script>

  </body>
</html>
