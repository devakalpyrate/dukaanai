      <style id="dukaan-custom-scrollbar-rules">
/* DukaanAI Universal Auto-Hiding Branded Scrollbar */
* {
  scrollbar-width: thin !important;
  scrollbar-color: transparent transparent !important;
  transition: scrollbar-color 0.4s ease-in-out !important;
}

::-webkit-scrollbar {
  width: 6px !important;
  height: 6px !important;
  background-color: transparent !important;
}

::-webkit-scrollbar-track {
  background: transparent !important;
  border-radius: 9999px !important;
}

::-webkit-scrollbar-thumb {
  background-color: transparent !important;
  border-radius: 9999px !important;
  transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease !important;
}

/* Show branded golden scrollbar ONLY while actively scrolling */
.is-scrolling::-webkit-scrollbar-thumb,
.is-scrolling *::-webkit-scrollbar-thumb,
html.is-scrolling *::-webkit-scrollbar-thumb,
body.is-scrolling *::-webkit-scrollbar-thumb,
::-webkit-scrollbar-thumb:active {
  background-color: #FFD026 !important;
  box-shadow: 0 0 10px rgba(255, 208, 38, 0.4) !important;
}

::-webkit-scrollbar-thumb:hover {
  background-color: #FFE066 !important;
}

::-webkit-scrollbar-button,
::-webkit-scrollbar-corner {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
  background: transparent !important;
}

/* Firefox Support */
.is-scrolling,
.is-scrolling *,
html.is-scrolling *,
body.is-scrolling * {
  scrollbar-color: #FFD026 transparent !important;
}

/* Compatibility classes */
.dukaan-custom-scrollbar,
.custom-scrollbar,
.auto-hide-scrollbar,
.scrollbar-thin {
  scrollbar-width: thin !important;
  scrollbar-color: transparent transparent !important;
}

.dukaan-custom-scrollbar.is-scrolling,
.custom-scrollbar.is-scrolling,
.auto-hide-scrollbar.is-scrolling,
.scrollbar-thin.is-scrolling,
.is-scrolling .dukaan-custom-scrollbar,
.is-scrolling .custom-scrollbar,
.is-scrolling .auto-hide-scrollbar,
.is-scrolling .scrollbar-thin {
  scrollbar-color: #FFD026 transparent !important;
}
</style>

<script id="dukaan-scroll-listener">
  (function() {
    var scrollTimeoutMap = new WeakMap();
    function markScrolling(el) {
      if (!el || !el.classList) return;
      el.classList.add('is-scrolling');
      var timer = scrollTimeoutMap.get(el);
      if (timer) clearTimeout(timer);
      scrollTimeoutMap.set(el, setTimeout(function() {
        el.classList.remove('is-scrolling');
      }, 800));
    }
    function handleScrollEvent(e) {
      var t = e.target;
      var el = (t === document || t === window) ? (document.documentElement || document.body) : t;
      markScrolling(el);
      if ((e.type === 'wheel' || e.type === 'touchmove') && el) {
        var p = el;
        while (p && p !== document.body && p !== document.documentElement) {
          if (p.scrollHeight > p.clientHeight || p.scrollWidth > p.clientWidth) {
            markScrolling(p);
            break;
          }
          p = p.parentElement;
        }
      }
    }
    window.addEventListener('scroll', handleScrollEvent, { capture: true, passive: true });
    window.addEventListener('wheel', handleScrollEvent, { capture: true, passive: true });
    window.addEventListener('touchmove', handleScrollEvent, { capture: true, passive: true });
  })();
</script>
