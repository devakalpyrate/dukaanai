syntax = "proto3";

package dukaanai.llm;

message UnderstandIntentRequest {
  string text = 1;
  string context = 2;
  int32 shop_id = 3;
}

message UnderstandIntentResponse {
  bool success = 1;
  string intent = 2;
  string action = 3;
  string parameters_json = 4;
  string entities_json = 5;
  string original_text = 6;
  string normalized_text = 7;
  string normalization_json = 8;
  float confidence = 9;
  bool requires_confirmation = 10;
  bool clarification_needed = 11;
  string clarification_question = 12;
  string error_message = 13;
}

service LLMService {
  rpc UnderstandIntent (UnderstandIntentRequest) returns (UnderstandIntentResponse);
}
